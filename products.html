<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Gaming Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎮 Products Management</h1>
      <div id="userInfo" style="display: none;"></div>
    </div>

    <div class="tabs">
      <a href="dashboard.html" class="tab">📊 Dashboard</a>
      <a href="products.html" class="tab active">🎮 Products</a>
      <a href="orders.html" class="tab">📦 Orders</a>
      <a href="customers.html" class="tab">👥 Customers</a>
      <a href="suppliers.html" class="tab">🏭 Suppliers</a>
      <a href="employees.html" class="tab" id="employeesTab">👔 Employees</a>
    </div>

    <div class="content">
      <div class="admin-only">
        <h3>Add New Product</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="productName" placeholder="Game name">
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="productCategory" placeholder="Action, RPG, etc.">
          </div>
          <div class="form-group">
            <label>Platform</label>
            <select id="productPlatform">
              <option>PS5</option>
              <option>Xbox</option>
              <option>PC</option>
              <option>Switch</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price (MAD)</label>
            <input type="number" id="productPrice" placeholder="499" min="0">
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input type="number" id="productStock" placeholder="50" min="0">
          </div>
          <div class="form-group">
            <label>Rating (0-5)</label>
            <input type="number" id="productRating" step="0.1" min="0" max="5" placeholder="4.5">
          </div>
          <div class="form-group">
            <label>Product Image</label>
            <input type="file" id="productImage" accept="image/*">
            <div id="imagePreview" style="margin-top: 10px;"></div>
          </div>
        </div>
        <button id="addProductBtn">Add Product</button>
        <button class="danger" id="clearProductsBtn">Clear All Products</button>
      </div>

      <h3 style="margin-top: 30px;">Products List</h3>
      <div id="productsTable"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
