<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Gaming Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📦 Orders Management</h1>
      <div id="userInfo" style="display: none;"></div>
    </div>

    <div class="tabs">
      <a href="dashboard.html" class="tab">📊 Dashboard</a>
      <a href="products.html" class="tab">🎮 Products</a>
      <a href="orders.html" class="tab active">📦 Orders</a>
      <a href="customers.html" class="tab">👥 Customers</a>
      <a href="suppliers.html" class="tab">🏭 Suppliers</a>
      <a href="employees.html" class="tab" id="employeesTab">👔 Employees</a>
    </div>

    <div class="content">
      <div class="admin-only">
        <h3>Add New Order</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Customer</label>
            <input type="text" id="orderCustomer" placeholder="Customer name">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="orderStatus">
              <option>pending</option>
              <option>paid</option>
              <option>shipped</option>
              <option>cancelled</option>
            </select>
          </div>
          <div class="form-group">
            <label>Amount (MAD)</label>
            <input type="number" id="orderAmount" placeholder="999" min="0">
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="orderDate">
          </div>
        </div>
        <button id="addOrderBtn">Add Order</button>
        <button class="danger" id="clearOrdersBtn">Clear All Orders</button>

        <div id="orderEditSection" style="display: none; margin-top: 30px;">
          <h3>Edit Order</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Customer</label>
              <input type="text" id="editOrderCustomer" placeholder="Customer name">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="editOrderStatus">
                <option>pending</option>
                <option>paid</option>
                <option>shipped</option>
                <option>cancelled</option>
              </select>
            </div>
            <div class="form-group">
              <label>Amount (MAD)</label>
              <input type="number" id="editOrderAmount" placeholder="999" min="0">
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="editOrderDate">
            </div>
          </div>
          <button id="saveOrderBtn">Save Changes</button>
          <button class="secondary" id="cancelOrderEditBtn">Cancel</button>
        </div>
      </div>

      <h3 style="margin-top: 30px;">Orders List</h3>
      <div id="ordersTable"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Check authentication
    const user = auth.getUser();
    if (!user) {
      window.location.href = 'login.html';
    } else {
      ui.updateUserInfo();
      ui.setupRoleUI();
      
      if (!auth.isAdmin()) {
        $('employeesTab').style.display = 'none';
      }
      
      // Set today's date
      $('orderDate').value = todayISO();
      
      orders.render();
    }
  </script>
</body>
</html>
