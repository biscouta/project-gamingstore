<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - Gaming Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>👔 Employees Management</h1>
      <div id="userInfo" style="display: none;"></div>
    </div>

    <div class="tabs">
      <a href="dashboard.html" class="tab">📊 Dashboard</a>
      <a href="products.html" class="tab">🎮 Products</a>
      <a href="orders.html" class="tab">📦 Orders</a>
      <a href="customers.html" class="tab">👥 Customers</a>
      <a href="suppliers.html" class="tab">🏭 Suppliers</a>
      <a href="employees.html" class="tab active">👔 Employees</a>
    </div>

    <div class="content">
      <div class="admin-only">
        <h3>Add New Employee</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="employeeName" placeholder="Jane Smith">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="employeeEmail" placeholder="jane@company.com">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="employeePhone" placeholder="+212 600 000 000">
          </div>
          <div class="form-group">
            <label>Role</label>
            <select id="employeeRole">
              <option>admin</option>
              <option>employee</option>
              <option>owner</option>
            </select>
          </div>
        </div>
        <button id="addEmployeeBtn">Add Employee</button>
        <button class="danger" id="clearEmployeesBtn">Clear All Employees</button>

        <div id="employeeEditSection" style="display: none; margin-top: 30px;">
          <h3>Edit Employee</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="editEmployeeName" placeholder="Jane Smith">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="editEmployeeEmail" placeholder="jane@company.com">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="editEmployeePhone" placeholder="+212 600 000 000">
            </div>
            <div class="form-group">
              <label>Role</label>
              <select id="editEmployeeRole">
                <option>admin</option>
                <option>employee</option>
                <option>owner</option>
              </select>
            </div>
          </div>
          <button id="saveEmployeeBtn">Save Changes</button>
          <button class="secondary" id="cancelEmployeeEditBtn">Cancel</button>
        </div>
      </div>

      <h3 style="margin-top: 30px;">Employees List</h3>
      <div id="employeesTable"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/employees.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Check authentication
    const user = auth.getUser();
    if (!user) {
      window.location.href = 'login.html';
    } else if (user.role !== 'admin' && user.role !== 'owner') {
      alert('Access denied. Admin role required for employee management.');
      window.location.href = 'dashboard.html';
    } else {
      ui.updateUserInfo();
      ui.setupRoleUI();
      
      employees.render();
    }
  </script>
</body>
</html>
