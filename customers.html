<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers - Gaming Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>👥 Customers Management</h1>
      <div id="userInfo" style="display: none;"></div>
    </div>

    <div class="tabs">
      <a href="dashboard.html" class="tab">📊 Dashboard</a>
      <a href="products.html" class="tab">🎮 Products</a>
      <a href="orders.html" class="tab">📦 Orders</a>
      <a href="customers.html" class="tab active">👥 Customers</a>
      <a href="suppliers.html" class="tab">🏭 Suppliers</a>
      <a href="employees.html" class="tab" id="employeesTab">👔 Employees</a>
    </div>

    <div class="content">
      <div class="admin-only">
        <h3>Add New Customer</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="customerName" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="customerEmail" placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="customerPhone" placeholder="+212 600 000 000">
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="customerCity" placeholder="Casablanca">
          </div>
        </div>
        <button id="addCustomerBtn">Add Customer</button>
        <button class="danger" id="clearCustomersBtn">Clear All Customers</button>

        <div id="customerEditSection" style="display: none; margin-top: 30px;">
          <h3>Edit Customer</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="editCustomerName" placeholder="John Doe">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="editCustomerEmail" placeholder="john@example.com">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="editCustomerPhone" placeholder="+212 600 000 000">
            </div>
            <div class="form-group">
              <label>City</label>
              <input type="text" id="editCustomerCity" placeholder="Casablanca">
            </div>
          </div>
          <button id="saveCustomerBtn">Save Changes</button>
          <button class="secondary" id="cancelCustomerEditBtn">Cancel</button>
        </div>
      </div>

      <h3 style="margin-top: 30px;">Customers List</h3>
      <div id="customersTable"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Check authentication
    const user = auth.getUser();
    if (!user) {
      window.location.href = 'login.html';
    } else {
      ui.updateUserInfo();
      ui.setupRoleUI();
      
      if (!auth.isAdmin()) {
        $('employeesTab').style.display = 'none';
      }
      
      customers.render();
    }
  </script>
</body>
</html>
