<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - Gaming Store</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏭 Suppliers Management</h1>
      <div id="userInfo" style="display: none;"></div>
    </div>

    <div class="tabs">
      <a href="dashboard.html" class="tab">📊 Dashboard</a>
      <a href="products.html" class="tab">🎮 Products</a>
      <a href="orders.html" class="tab">📦 Orders</a>
      <a href="customers.html" class="tab">👥 Customers</a>
      <a href="suppliers.html" class="tab active">🏭 Suppliers</a>
      <a href="employees.html" class="tab" id="employeesTab">👔 Employees</a>
    </div>

    <div class="content">
      <div class="admin-only">
        <h3>Add New Supplier</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="supplierName" placeholder="Supplier name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="supplierEmail" placeholder="supplier@example.com">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="supplierPhone" placeholder="+212 600 000 000">
          </div>
        </div>
        <button id="addSupplierBtn">Add Supplier</button>
        <button class="danger" id="clearSuppliersBtn">Clear All Suppliers</button>

        <div id="supplierEditSection" style="display: none; margin-top: 30px;">
          <h3>Edit Supplier</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="editSupplierName" placeholder="Supplier name">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="editSupplierEmail" placeholder="supplier@example.com">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="editSupplierPhone" placeholder="+212 600 000 000">
            </div>
          </div>
          <button id="saveSupplierBtn">Save Changes</button>
          <button class="secondary" id="cancelSupplierEditBtn">Cancel</button>
        </div>
      </div>

      <h3 style="margin-top: 30px;">Suppliers List</h3>
      <div id="suppliersTable"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/suppliers.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Check authentication
    const user = auth.getUser();
    if (!user) {
      window.location.href = 'login.html';
    } else {
      ui.updateUserInfo();
      ui.setupRoleUI();
      
      if (!auth.isAdmin()) {
        $('employeesTab').style.display = 'none';
      }
      
      suppliers.render();
    }
  </script>
</body>
</html>
